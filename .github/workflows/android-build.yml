name: LUMI Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack project
        run: |
          mkdir -p lumi-project
          unzip -o LUMI_Android_Project_1.4_stage14.zip -d lumi-project
          find lumi-project -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS=$(find lumi-project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-debug-apk
          path: lumi-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
